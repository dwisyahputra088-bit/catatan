<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Utang</title>
    <!-- Tailwind CSS CDN untuk Tampilan Modern -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <div class="max-w-2xl mx-auto px-4 pt-8">
        <!-- Header & Total Ringkasan -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 text-center border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">💰 Catatan Utang Piutang</h1>
            <p class="text-sm text-gray-500 mb-4">Kelola tagihan dengan rapi dan otomatis</p>
            <div class="grid grid-cols-2 gap-4 border-t pt-4">
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Total Utang Saya</p>
                    <p id="total-utang" class="text-lg font-bold text-red-600">Rp 0</p>
                </div>
                <div class="border-l border-gray-200">
                    <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Total Piutang (Tagihan)</p>
                    <p id="total-piutang" class="text-lg font-bold text-green-600">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Form Tambah Catatan -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-200">
            <h2 class="text-md font-bold text-gray-700 mb-4">➕ Tambah Catatan Baru</h2>
            <form id="form-utang" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Orang/Kontak</label>
                        <input type="text" id="nama" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Budi">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Jenis Transaksi</label>
                        <select id="jenis" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="utang">Saya Berutang Ke Dia</option>
                            <option value="piutang">Dia Berutang Ke Saya</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nominal (Rp)</label>
                        <input type="number" id="nominal" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Jatuh Tempo (Opsional)</label>
                        <input type="date" id="jatuh-tempo" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Keterangan / Catatan</label>
                    <input type="text" id="keterangan" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Keterangan tambahan...">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-blue-700 transition">Simpan Catatan</button>
            </form>
        </div>

        <!-- Daftar Catatan -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-md font-bold text-gray-700">📋 Daftar Utang & Piutang</h2>
                <span id="jumlah-data" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-medium">0 Data</span>
            </div>
            
            <div id="kontainer-daftar" class="space-y-3 max-h-96 overflow-y-auto global-scroll">
                <!-- Data akan dimuat secara dinamis oleh JavaScript -->
                <p class="text-sm text-gray-400 text-center py-6">Belum ada catatan transaksi.</p>
            </div>
        </div>
    </div>

    <!-- Logika Aplikasi (JavaScript) -->
    <script>
        let dataTransaksi = JSON.parse(localStorage.getItem('catatan_utang')) || [];

        const form = document.getElementById('form-utang');
        const kontainerDaftar = document.getElementById('kontainer-daftar');

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function perbaruiTampilan() {
            kontainerDaftar.innerHTML = '';
            let totalUtang = 0;
            let totalPiutang = 0;

            if (dataTransaksi.length === 0) {
                kontainerDaftar.innerHTML = `<p class="text-sm text-gray-400 text-center py-6">Belum ada catatan transaksi.</p>`;
            } else {
                dataTransaksi.forEach((item, index) => {
                    if (item.jenis === 'utang') totalUtang += item.nominal;
                    else totalPiutang += item.nominal;

                    const itemDaftar = document.createElement('div');
                    itemDaftar.className = `p-4 rounded-xl border flex justify-between items-center ${item.jenis === 'utang' ? 'bg-red-50 border-red-100' : 'bg-green-50 border-green-100'}`;
                    
                    itemDaftar.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm text-gray-800">${item.nama}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold uppercase ${item.jenis === 'utang' ? 'bg-red-200 text-red-800' : 'bg-green-200 text-green-800'}">
                                    ${item.jenis === 'utang' ? 'Utang Saya' : 'Piutang'}
                                </span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">${item.keterangan || 'Tanpa keterangan'}</p>
                            ${item.jatuhTempo ? `<p class="text-[11px] text-amber-700 font-medium mt-1">⏳ Tempo: ${item.jatuhTempo}</p>` : ''}
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold ${item.jenis === 'utang' ? 'text-red-600' : 'text-green-600'}">${formatRupiah(item.nominal)}</p>
                            <button onclick="hapusCatatan(${index})" class="text-xs text-gray-400 hover:text-red-500 mt-1 transition">Hapus</button>
                        </div>
                    `;
                    kontainerDaftar.appendChild(itemDaftar);
                });
            }

            document.getElementById('total-utang').innerText = formatRupiah(totalUtang);
            document.getElementById('total-piutang').innerText = formatRupiah(totalPiutang);
            document.getElementById('jumlah-data').innerText = `${dataTransaksi.length} Data`;
            
            // Simpan perubahan ke penyimpanan lokal browser
            localStorage.setItem('catatan_utang', JSON.stringify(dataTransaksi));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const transaksiBaru = {
                nama: document.getElementById('nama').value,
                jenis: document.getElementById('jenis').value,
                nominal: parseFloat(document.getElementById('nominal').value),
                jatuhTempo: document.getElementById('jatuh-tempo').value,
                keterangan: document.getElementById('keterangan').value
            };

            dataTransaksi.push(transaksiBaru);
            perbaruiTampilan();
            form.reset();
        });

        function hapusCatatan(index) {
            if (confirm('Apakah Anda yakin ingin menghapus catatan ini?')) {
                dataTransaksi.splice(index, 1);
                perbaruiTampilan();
            }
        }

        // Jalankan pembaruan data saat pertama kali aplikasi dibuka
        perbaruiTampilan();
    </script>
</body>
</html>
